version: '3.8'
services:
  mysql:
    image: mysql:8
    container_name: gabboo-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: wolfp25!
      MYSQL_DATABASE: gabboo
      MYSQL_USER: gabboo
      MYSQL_PASSWORD: wolfp25!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql

  backend:
    build: .
    container_name: gabboo-backend-prod
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gabboo
      SPRING_DATASOURCE_USERNAME: gabboo
      SPRING_DATASOURCE_PASSWORD: wolfp25!
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - mysql

volumes:
  mysql_data_prod:
