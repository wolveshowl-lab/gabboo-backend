services:
  gabboo-backend:
    build:
      context: .
      args:
        GIT_BRANCH: main
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://gabboo-mysql:3306/gabboo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: gabboo
      SPRING_DATASOURCE_PASSWORD: wolfp25!
    depends_on:
      - gabboo-mysql

  gabboo-mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: wolfp25!
      MYSQL_DATABASE: gabboo
      MYSQL_USER: gabboo
      MYSQL_PASSWORD: wolfp25!
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql

volumes:
  mysql_data_prod:
